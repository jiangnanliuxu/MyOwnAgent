name: agent-desk-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-desk-postgres
    environment:
      POSTGRES_DB: agentdesk
      POSTGRES_USER: agentdesk
      POSTGRES_PASSWORD: agentdesk_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdesk -d agentdesk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agent-desk-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: agent-desk-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: agentdesk
      MINIO_ROOT_PASSWORD: agentdesk_dev_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: agent-desk-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 agentdesk agentdesk_dev_minio_password &&
      mc mb --ignore-existing local/agent-desk-dev &&
      mc anonymous set none local/agent-desk-dev
      "
    restart: "no"

  agent-python:
    build:
      context: ../agent-python
    container_name: agent-desk-agent-python
    environment:
      AGENT_INTERNAL_TOKEN: local-dev-internal-token
      AGENT_REDIS_URL: redis://redis:6379/0
      AGENT_JOBS_STREAM: agent.jobs
      SPRING_TOOL_GATEWAY_URL: http://host.docker.internal:18080/internal/tools/invoke
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
