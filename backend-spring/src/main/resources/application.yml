spring:
  application:
    name: agent-desk-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-no-request-id}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

agent-desk:
  api:
    version: v1
  security:
    jwt:
      secret: ${AGENT_DESK_JWT_SECRET:local-development-only-change-this-placeholder-secret-32}
      access-token-ttl: ${AGENT_DESK_JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${AGENT_DESK_JWT_REFRESH_TOKEN_TTL:7d}
  infrastructure:
    enabled: false
    postgres:
      host: localhost
      port: 5432
      database: agentdesk
    redis:
      host: localhost
      port: 6379
    minio:
      endpoint: http://localhost:9000
      bucket: agent-desk-dev
    milvus:
      enabled: false
      endpoint: http://localhost:19530

---
spring:
  config:
    activate:
      on-profile: "!dev"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  flyway:
    enabled: false

management:
  health:
    db:
      enabled: false
    redis:
      enabled: false
