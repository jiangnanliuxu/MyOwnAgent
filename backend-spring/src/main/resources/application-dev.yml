spring:
  datasource:
    url: ${AGENT_DESK_DATABASE_URL:jdbc:postgresql://localhost:5432/agentdesk}
    username: ${AGENT_DESK_DATABASE_USERNAME:agentdesk}
    password: ${AGENT_DESK_DATABASE_PASSWORD:agentdesk_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${AGENT_DESK_DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${AGENT_DESK_DATABASE_MIN_IDLE:2}
      connection-timeout: ${AGENT_DESK_DATABASE_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${AGENT_DESK_REDIS_HOST:localhost}
      port: ${AGENT_DESK_REDIS_PORT:6379}
      password: ${AGENT_DESK_REDIS_PASSWORD:}
      timeout: ${AGENT_DESK_REDIS_TIMEOUT:2s}

management:
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true

agent-desk:
  infrastructure:
    enabled: true
    postgres:
      host: ${AGENT_DESK_POSTGRES_HOST:localhost}
      port: ${AGENT_DESK_POSTGRES_PORT:5432}
      database: ${AGENT_DESK_POSTGRES_DB:agentdesk}
      username: ${AGENT_DESK_DATABASE_USERNAME:agentdesk}
    redis:
      host: ${AGENT_DESK_REDIS_HOST:localhost}
      port: ${AGENT_DESK_REDIS_PORT:6379}
    minio:
      endpoint: ${AGENT_DESK_MINIO_ENDPOINT:http://localhost:9000}
      bucket: ${AGENT_DESK_MINIO_BUCKET:agent-desk-dev}
      access-key: ${AGENT_DESK_MINIO_ACCESS_KEY:agentdesk}
      secret-key: ${AGENT_DESK_MINIO_SECRET_KEY:agentdesk_dev_minio_password}
    milvus:
      enabled: ${AGENT_DESK_MILVUS_ENABLED:false}
      endpoint: ${AGENT_DESK_MILVUS_ENDPOINT:http://localhost:19530}
  cors:
    allowed-origins:
      - "http://localhost:4173"
      - "http://127.0.0.1:4173"
